name: Continuum
# Description is a literal on purpose: non-ASCII cannot go through expand(),
# Gradle reads that source file in the platform encoding otherwise.
# The version line is ASCII and is substituted by the build below.
description: Distributed player-state synchronization for Minecraft networks.
version: '${version}'

main: lol.candyriya.continuum.paper.ContinuumPaperPlugin
bootstrapper: lol.candyriya.continuum.paper.ContinuumPaperBootstrap
loader: lol.candyriya.continuum.paper.ContinuumPaperLoader
api-version: '26.3'
load: POSTWORLD
# Declares this plugin compatible with Folia; Paper itself ignores the key.
folia-supported: true

authors: [ CandyriyaMC ]
website: https://github.com/CandyriyaMC/Continuum
