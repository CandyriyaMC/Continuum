# Main plugin config. Everything is MiniMessage, cheat sheet: https://webui.advntr.dev/
# Delete a key and it comes back with its default value on the next start/reload.

# Do not touch: config schema version, migrations on plugin upgrade key off of this
config-version: 1

# Prefix of all plugin messages
prefix: "<gray>[<gradient:#7ed6ff:#4a9eff>Continuum</gradient>]</gray> "

# Core debug logging
debug: false

# Join welcome message, <player> gets substituted automatically
welcome:
  enabled: true
  message: "<green>Hey, <player>! Welcome to the network :)"
