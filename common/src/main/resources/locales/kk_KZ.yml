# Continuum хабарламалары, kk_KZ.
# MiniMessage пішімі: https://docs.advntr.dev/minimessage/
# "Args" әр хабарламаға арналған типтелген плейсхолдерлерді көрсетеді.
# Аргумент атаулары шаблондағы <тегке> сәйкес келеді.

player:
  # Ойыншыға join/transfer кезінде снапшоты қалпына келтіріліп жатқанда көрсетіледі.
  # Args: none
  loading: "<gray>Деректеріңіз жүктелуде, күте тұрыңыз..."
  # Қалпына келтіру сәтті аяқталғаннан кейін.
  # Args: none
  restored: "<green>Деректеріңіз қалпына келтірілді."
  # Қалпына келтіру сәтсіз аяқталды; мәселе шешілгенше ойыншы шектелген күйде қалады.
  # Args: none
  restore-failed: "<red>Деректеріңізді қалпына келтіру сәтсіз аяқталды. Әкімшіге хабарласыңыз."
  # Қалпына келтіру сәтсіз аяқталғанда көрсетіледі: ойыншы серверден шығарылады, қайта кіре алады.
  # failures = ойыншының сәтсіз қалпына келтіру әрекеттерінің тізбегі; limit = бапталған max-failures.
  # Args: failures (number), limit (number)
  restore-failed-kick: "<red>Деректеріңізді қалпына келтіру сәтсіз аяқталды. Сәтсіз әрекеттер: <failures>/<limit>. Әкімшіге хабарласыңыз."

sync:
  error:
    # Дерекқор сұрауды қабылдамады немесе қолжетімсіз.
    # Args: none
    database: "<red>Дерекқор қолжетімсіз. Кейінірек қайталап көріңіз."
    # Жазбаны жаңарақ сессия иеленді; бұл түйін fencing нәтижесінде жеңілді.
    # Args: none
    fencing: "<red>Сессияңызды басқа сервер иеленді. Қайта қосылыңыз."
    # Снапшот өлшем шегінен асты; ештеңе жазылмады.
    # Args: none
    too-large: "<red>Деректеріңіз сақтау үшін тым үлкен. Әкімшіге хабарласыңыз."
    # Снапшотты сериализациялау сәтсіз аяқталды (модуль пэйлоады қате, байттар өзгертілген).
    # Args: none
    serialization: "<red>Деректеріңізді оқу немесе жазу мүмкін болмады."
    # Схема миграциясы жоқ немесе жарамсыз құжат берді.
    # Args: none
    migration: "<red>Деректеріңіз қолданылмайтын формат нұсқасын пайдаланады."
    # RabbitMQ/plugin messaging жолы сәтсіз аяқталды; өзгерістер желіге таралмауы мүмкін.
    # Args: none
    messaging: "<red>Желіге қосылу мүмкін болмады. Кейбір өзгерістер синхрондалмауы мүмкін."

transfer:
  # Ауысу қабылданды, мақсатты сервер хабардар етілді. server — мақсаттың көрсетілетін атауы.
  # Args: server (text)
  requested: "<gray><server> серверіне ауысу дайындалуда..."
  # Ойыншы дәл қазір ауыстырылуда.
  # Args: server (text)
  started: "<gray>Сізді <server> серверіне ауыстыру..."
  # Мақсат қалпына келтіріп, ауысуды растады.
  # Args: server (text)
  completed: "<green><server> серверіне қош келдіңіз."
  # Ауысу commit-ге дейін тоқтатылды; ойыншы бастапқы серверде қалады.
  # Args: server (text)
  failed: "<red>Ауысу сәтсіз аяқталды. Сіз осы серверде қаласыз."

admin:
  status:
    # Түйін толық жұмыс істейді.
    # Args: none
    online: "<green>Онлайн"
    # Түйін қолжетімсіз/жұмыс істемейді.
    # Args: none
    offline: "<red>Оффлайн"
    # Түйін шектеулі мүмкіндіктермен жұмыс істейді (мысалы, дерекқор жоқ, кэш қолданылады).
    # Args: none
    degraded: "<yellow>Шектелген режим"
  reload:
    # Конфигурация қайта жүктеліп, қолданылды.
    # Args: none
    success: "<green>Конфигурация қайта жүктелді."
    # Қайта жүктеу қабылданбады; алдыңғы конфигурация әрекет етеді.
    # Args: none
    failed: "<red>Қайта жүктеу сәтсіз аяқталды; алдыңғы конфигурация сақталды."

update:
  # Жаңа Continuum нұсқасы қолжетімді болғанда әкімшіге.
  # Args: current (text) - ағымдағы нұсқа, latest (text) - қолжетімді нұсқа
  available: "<gold>Continuum жаңартуы қолжетімді: <current> -> <latest>. Әкімшіңізге хабарлаңыз."

license:
  # Tip-jar лицензиясы бар және жарамды.
  # Args: none
  active: "<green>Лицензия жарамды. Continuum-ды қолдағаныңызға рахмет!"
  # Лицензия табылмады; плагин әйтеуір еркін жұмыс істейді.
  # Args: link (text) - tip-jar лицензиясын қайдан алуға болатыны
  missing: "<yellow>Лицензия табылмады. Continuum еркін жұмыс істейді. Дамытуға көмектескіңіз келсе, tip-jar лицензиясын алыңыз: <link>"
  # Лицензия мерзімі өтті; плагин жұмыс істейді, қолдау көрсетілмейді.
  # Args: none
  expired: "<yellow>Tip-jar лицензияңыздың мерзімі өтті. Continuum жұмысын тоқтатпайды; қолдау кепілдік берілмейді."
  # Лицензия бұл жинақ нұсқасын қамтымайды.
  # Args: version (text) - лицензия қамтымайтын ағымдағы нұсқа
  version-mismatch: "<red>Лицензияңыз бұл нұсқаны (<version>) қамтымайды. Continuum жұмысын тоқтатпайды, бірақ қолдау лицензияланған нұсқаға қатысты."
