# Сообщения Continuum, ru_RU.
# Формат MiniMessage: https://docs.advntr.dev/minimessage/
# В "Args" перечислены типизированные подстановки для каждого сообщения.
# Имена аргументов совпадают с <тегом> в шаблоне.

player:
  # Игроку, пока его снапшот восстанавливается после входа/переноса.
  # Args: none
  loading: "<gray>Загружаем ваши данные, секунду..."
  # Показывается после успешного восстановления.
  # Args: none
  restored: "<green>Ваши данные восстановлены."
  # Восстановление не удалось; игрок остаётся ограничен до решения проблемы.
  # Args: none
  restore-failed: "<red>Не удалось восстановить ваши данные. Обратитесь к администратору."
  # Показывается, когда восстановление не удалось: игрока кикают, он может перезайти.
  # failures = подряд неудачных попыток восстановления у игрока; limit = настроенный max-failures.
  # Args: failures (number), limit (number)
  restore-failed-kick: "<red>Не удалось восстановить ваши данные. Неудачных попыток: <failures> из <limit>. Обратитесь к администратору."

sync:
  error:
    # Хранилище отклонило запрос или недоступно.
    # Args: none
    database: "<red>База данных недоступна. Попробуйте чуть позже."
    # Более новая сессия владеет записью; этот узел проиграл гонку fencing-токенов.
    # Args: none
    fencing: "<red>Ваша сессия была перехвачена другим сервером. Перезайдите, пожалуйста."
    # Снапшот превысил лимит размера; ничего не записано.
    # Args: none
    too-large: "<red>Ваши данные слишком большие для сохранения. Обратитесь к администратору."
    # Ошибка сериализации снапшота (плохой payload модуля, повреждённые байты).
    # Args: none
    serialization: "<red>Не удалось прочитать или записать ваши данные."
    # Миграция схемы отсутствует или дала невалидный документ.
    # Args: none
    migration: "<red>Ваши данные используют неподдерживаемую версию формата."
    # Путь RabbitMQ/plugin messaging не сработал; часть изменений может не разойтись по сети.
    # Args: none
    messaging: "<red>Не удалось связаться с сетью. Часть изменений может не синхронизироваться."

transfer:
  # Перенос принят, целевой сервер уведомлён. server — отображаемое имя цели.
  # Args: server (text)
  requested: "<gray>Готовим ваш переход на <server>..."
  # Игрока переносят прямо сейчас.
  # Args: server (text)
  started: "<gray>Перемещаем вас на <server>..."
  # Цель восстановила данные и подтвердила перенос.
  # Args: server (text)
  completed: "<green>Добро пожаловать на <server>."
  # Перенос отменён до коммита; игрок остаётся на исходном сервере.
  # Args: server (text)
  failed: "<red>Переход не удался. Вы останетесь на этом сервере."

admin:
  status:
    # Узел полностью работоспособен.
    # Args: none
    online: "<green>Онлайн"
    # Узел недоступен/не запущен.
    # Args: none
    offline: "<red>Оффлайн"
    # Узел работает с ограниченными возможностями (например, нет БД, работает кэш).
    # Args: none
    degraded: "<yellow>Ограниченный режим"
  reload:
    # Конфигурация перезагружена и применена.
    # Args: none
    success: "<green>Конфигурация перезагружена."
    # Перезагрузка отклонена; действует прежняя конфигурация.
    # Args: none
    failed: "<red>Перезагрузка не удалась; применена предыдущая конфигурация."

update:
  # Админу, когда доступна новая сборка Continuum.
  # Args: current (text) - текущая версия, latest (text) - доступная версия
  available: "<gold>Доступно обновление Continuum: <current> -> <latest>. Сообщите администратору."

license:
  # Tip-jar лицензия есть и валидна.
  # Args: none
  active: "<green>Лицензия действительна. Спасибо, что поддерживаете Continuum!"
  # Лицензии нет; плагин работает бесплатно в любом случае.
  # Args: link (text) - где взять tip-jar лицензию
  missing: "<yellow>Лицензия не найдена. Continuum работает свободно. Чтобы поддержать разработку, возьмите tip-jar лицензию: <link>"
  # Срок лицензии истёк; плагин работает, поддержка — нет.
  # Args: none
  expired: "<yellow>Срок вашей tip-jar лицензии истёк. Continuum продолжит работать; поддержка больше не гарантируется."
  # Лицензия не покрывает эту версию сборки.
  # Args: version (text) - работающая версия, которую не покрывает лицензия
  version-mismatch: "<red>Ваша лицензия не покрывает эту версию (<version>). Continuum продолжит работать, но поддержка действует для лицензированной версии."
