# git-cliff configuration for Continuum.
#
# Release notes are generated by .github/workflows/release.yml for the latest
# build-<N> tag. Dev builds do not produce release notes.
#
# Run locally to preview: git-cliff --latest --strip header

[changelog]
header = """
# Changelog

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="build-") }}] - {{ timestamp | date(format="%Y-%m-%d") }}

{% else %}\
## Unreleased

{% endif -%}\
{% set breaking = commits | filter(attribute="breaking", value=true) -%}\
{% if breaking | length > 0 %}\
### Breaking Changes

{% for commit in breaking -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/CandyriyaMC/Continuum/commit/{{ commit.id }}))
{% endfor %}
{% endif -%}\
{% for group, commits in commits | group_by(attribute="group") %}\
### {{ group | striptags | trim | upper_first }}

{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/CandyriyaMC/Continuum/commit/{{ commit.id }})){% if commit.breaking %} - **BREAKING**{% endif %}
{% endfor %}

{% endfor -%}\
{% if version and previous.version %}\
**Full Changelog**: https://github.com/CandyriyaMC/Continuum/compare/{{ previous.version }}...{{ version }}
{% endif %}\
"""
trim = true
footer = """

<!-- generated by git-cliff -->
"""

[git]
conventional_commits = true
# Keep non-conventional commits (e.g. "Initial commit") instead of dropping them;
# they land in "Other Changes" via the catch-all parser below.
filter_unconventional = false
fail_on_unmatched_commit = false
protect_breaking_commits = true
split_commits = false
# Release tags only. Dev builds never create tags.
tag_pattern = '^build-[0-9]+$'
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
commit_parsers = [
  # Breaking commits keep their regular group AND are listed in the
  # Breaking Changes section via the template filter above.
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs?", group = "Docs" },
  { message = "^test", group = "Tests" },
  { message = "^chore", group = "Chore" },
  { message = "^ci", group = "CI" },
  { message = "^build", group = "Build" },
  { message = "^style", group = "Chore" },
  { message = "^revert", skip = true },
  # squash-merged PR titles from GitHub land here when they carry no type
  { message = ".*", group = "Other Changes" },
]
link_parsers = [
  { pattern = "#(\\d+)", href = "https://github.com/CandyriyaMC/Continuum/issues/$1" },
]
