version: 2

updates:
  # Gradle dependencies and the wrapper
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle-wrapper:
        patterns: ["gradle-wrapper"]
      # Platform APIs (Paper, Folia, Velocity) move in lockstep with Minecraft
      # releases and are upgraded together — keep them in a single PR
      platform-apis:
        patterns:
          - "io.papermc.paper*"
          - "dev.folia*"
          - "com.velocitypowered*"
      # Batch patch/minor bumps into one PR to cut review noise.
      # Major bumps stay individual on purpose: they need a human.
      minor-and-patch:
        update-types: ["minor", "patch"]
    # No ignore list on purpose: the platform runtimes ride on fresh majors,
    # and lagging behind costs more than upgrading

  # GitHub Actions used in this repo's workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all action bumps — frequent, low-risk releases
      actions:
        patterns: ["*"]
