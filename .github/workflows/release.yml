name: release

# Release on a vX.Y.Z tag push. The version in gradle.properties is the source of
# truth — bump it before tagging and keep the tag in sync (v1.2.3 for version 1.2.3).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        run: ./gradlew build --parallel --stacktrace
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            paper/build/libs/*.jar
            velocity/build/libs/*.jar
          generate_release_notes: true
