# Continuum version catalog.
# Versions verified against the live repositories on 2026-11-19:
#   repo.papermc.io — paper-api, folia-api, velocity-api
#   repo.maven.apache.org (Maven Central) — everything else except the two plugins
#   plugins.gradle.org — shadow, run-paper, run-velocity
# Latest stable everywhere; snapshots/RCs are not pinned on purpose.

[versions]
# --- Platform APIs ------------------------------------------------------------
minecraft = "26.3"       # paper-plugin.yml api-version and the runServer target
# Dynamic ref resolves to the newest 26.3 build; as of today that is
# 26.3.build.256-stable (26.3.build.+ does not match the 26.3-pre-2 alpha line).
paper-api = "26.3.build.+"
# Folia ships from the same repo/group layout. The 26.3 line is all -stable now
# (the -beta line was 26.2); newest is 26.3.build.26-stable.
folia-api = "26.3.build.+"
# Velocity 4.3.1 is the latest stable release (4.3.2-SNAPSHOT is still in flight).
# Requires Java 25 at runtime, matching our toolchain.
velocity-api = "4.3.1"
# Adventure 5 is provided by both platforms at runtime; in api/common it goes as
# an api dependency for compilation but is excluded from the shade bundles.
adventure = "5.2.0"

# --- Persistence ----------------------------------------------------------------
hikari = "7.1.0"                # current major; wants a recent JDK (we are on 25)
mysql-connector-j = "26.10.0"   # Connector/J moved to calendar versioning
mariadb-client = "4.0.0"        # current stable major; Java 17+ runtime
mongodb = "5.14.0"              # sync driver is the one we want

# --- Messaging ------------------------------------------------------------------
amqp-client = "5.38.0"

# --- Serialization --------------------------------------------------------------
# Jackson 3 (tools.jackson group); jackson-annotations stays on the 2.x line,
# managed by the same BOM. JSON is the snapshot format (see decisions), no CBOR.
jackson = "3.3.0"

# --- Config & commands ----------------------------------------------------------
configurate = "4.2.0"           # YAML configs, bundled into the jars with relocation
# Cloud v2 core and platforms are versioned separately: cloud-core 2.1.0 is what
# cloud-paper/cloud-velocity 2.0.1 are compiled against (see their POMs).
# Do not merge them into one entry — that artifact simply does not exist.
cloud-core = "2.1.0"
cloud-platform = "2.0.1"
slf4j = "2.0.20"                # 2.1.0 is still alpha; platforms provide it at runtime
annotations = "26.1.0"          # JetBrains nullability, compileOnly, not bundled

# --- Metrics --------------------------------------------------------------------
# Opt-in only, not wired into the plugins yet.
bstats = "3.2.1"

# --- Test ------------------------------------------------------------------------
# junit-bom aligns all jupiter artifacts. testcontainers-bom aligns the
# testcontainers modules (2.x: testcontainers-mysql, testcontainers-rabbitmq, ...).
# Integration tests run against real services in containers, never mocks.
junit = "6.1.3"                # 6.2.0 is only at M1; 6.1.3 is the latest stable
testcontainers = "2.0.5"

# --- Build plugins -----------------------------------------------------------------
shadow = "9.6.1"
run-task = "3.1.0"

[libraries]
# --- Platform APIs ---------------------------------------------------------------
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper-api" }
folia-api = { module = "dev.folia:folia-api", version.ref = "folia-api" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity-api" }

adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }

# --- Persistence -------------------------------------------------------------------
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
mysql-connector-j = { module = "com.mysql:mysql-connector-j", version.ref = "mysql-connector-j" }
mariadb-java-client = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb-client" }
mongodb-driver-sync = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodb" }

# --- Messaging ----------------------------------------------------------------------
amqp-client = { module = "com.rabbitmq:amqp-client", version.ref = "amqp-client" }

# --- Serialization -------------------------------------------------------------------
# Jackson via BOM: jackson-databind/jackson-core are tools.jackson 3.x,
# jackson-annotations stays com.fasterxml.jackson.core 2.x (managed by the same BOM).
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
jackson-core = { module = "tools.jackson.core:jackson-core" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }

# --- Config & commands ----------------------------------------------------------------
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }

cloud-core = { module = "org.incendo:cloud-core", version.ref = "cloud-core" }
cloud-paper = { module = "org.incendo:cloud-paper", version.ref = "cloud-platform" }
cloud-velocity = { module = "org.incendo:cloud-velocity", version.ref = "cloud-platform" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }

# --- Metrics --------------------------------------------------------------------------
bstats-bukkit = { module = "org.bstats:bstats-bukkit", version.ref = "bstats" }
bstats-velocity = { module = "org.bstats:bstats-velocity", version.ref = "bstats" }

# --- Test --------------------------------------------------------------------------------
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers = { module = "org.testcontainers:testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-mysql = { module = "org.testcontainers:testcontainers-mysql" }
testcontainers-mariadb = { module = "org.testcontainers:testcontainers-mariadb" }
testcontainers-mongodb = { module = "org.testcontainers:testcontainers-mongodb" }
testcontainers-rabbitmq = { module = "org.testcontainers:testcontainers-rabbitmq" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
run-paper = { id = "xyz.jpenilla.run-paper", version.ref = "run-task" }
run-velocity = { id = "xyz.jpenilla.run-velocity", version.ref = "run-task" }
